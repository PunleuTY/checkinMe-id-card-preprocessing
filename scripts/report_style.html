<style>
  @page {
    size: A4;
    margin: 18mm 16mm;
  }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: -apple-system, "Helvetica Neue", "Segoe UI",
                 "Khmer Sangam MN", "Khmer MN", sans-serif;
    line-height: 1.6;
    color: #1a1a1a;
    font-size: 12.5px;
    max-width: 100%;
  }
  h1 { font-size: 24px; border-bottom: 3px solid #3b6ef5; padding-bottom: 8px;
       margin-top: 0; }
  h2 { font-size: 19px; margin-top: 28px; border-bottom: 1px solid #e2e2e2;
       padding-bottom: 5px; page-break-after: avoid; }
  h3 { font-size: 15px; margin-top: 20px; color: #2c3e50; page-break-after: avoid; }
  p, li { orphans: 2; widows: 2; }
  code {
    background: #f4f4f6; padding: 1px 5px; border-radius: 4px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 0.88em;
  }
  pre {
    background: #1e2130; color: #e6e6e6; padding: 14px; border-radius: 8px;
    overflow-x: auto; font-size: 11px; line-height: 1.45;
    page-break-inside: avoid;
    font-family: "SF Mono", Menlo, Consolas, "Khmer Sangam MN", monospace;
  }
  pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 12px;
          page-break-inside: avoid; }
  th, td { border: 1px solid #d6d6d6; padding: 7px 9px; text-align: left;
           vertical-align: top; }
  th { background: #f4f6fb; font-weight: 600; }
  blockquote { border-left: 4px solid #3b6ef5; margin: 14px 0; padding: 6px 14px;
               background: #f6f8fd; color: #444; }
  hr { border: none; border-top: 1px solid #e2e2e2; margin: 26px 0; }
  em { color: #555; }
  a { color: #2c5ce8; text-decoration: none; }
</style>
